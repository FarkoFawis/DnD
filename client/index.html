<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1917" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>DnD Table</title>
    <!-- The two fonts every screen uses, fetched together with the page instead of after the styles. -->
    <link rel="preload" href="/src/fonts/source-sans-3-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/alegreya-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // The saved theme and language, before anything is drawn (client/src/settings.ts takes over afterwards).
      try {
        var saved = JSON.parse(localStorage.getItem('dnd.settings') || '{}');
        var t = saved.theme;
        if (t === 'light' || t === 'black') document.documentElement.dataset.theme = t;
        // The language too, so the browser doesn't offer to translate a page that already is.
        var l = saved.language || (navigator.language || '').slice(0, 2).toLowerCase();
        if (l === 'de' || l === 'en') document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
