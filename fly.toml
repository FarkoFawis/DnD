# Hosting on Fly.io. The step-by-step guide is docs/hosting.md.
# `fly launch --copy-config --name <your-name> ...` puts your own app name in here.
app = "dnd-table"
primary_region = "fra" # Frankfurt

[build]
  dockerfile = "Dockerfile"

# The permanent disk: database, uploaded pictures and private content packs live in /data.
# One disk means one machine: never scale this app to two.
[mounts]
  source = "dnd_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  # The machine sleeps when nobody is connected and wakes on the next visit (a few seconds).
  # Nothing is lost: sessions, characters and pictures are on the disk.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
